[package]
name = "xmip-core-identify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-identify"
description = "The Xmip identification gate: read the claim out of an arrival."

[lib]
# A host crate: the technologies mount beside this source (ADR-0049).
path = ".src/lib.rs"

[dependencies]
xcore = { workspace = true }
stream = { workspace = true }
message = { workspace = true }
context = { workspace = true }
# X.690, for the conversion that lets a technology reading a Kerberos token
# with it write `?`.
asn1 = { workspace = true }
# Encoding primitives, whose failures this crate's error takes with `From`.
codec = { workspace = true }
# The NTLM message layout, whose failures this crate's error takes with `From`.
ntlm = { workspace = true }
# JOSE, the estate's one copy: the token a property carries and the claims a
# principal name is read from (jwt.rs), and the failures this crate's error
# takes with `From`. Its keys stay off: this gate verifies nothing.
jose = { workspace = true }
# Network primitives, whose failures this crate's error takes with `From`.
net = { workspace = true }

[lints]
