# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-identify"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-identify"
description = "The Xmip identification gate: read the claim out of an arrival."

[lib]
# A host crate: the technologies mount beside this source (ADR-0049).
path = ".src/lib.rs"

[dependencies]
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }
message = { package = "xmip-core-message", git = "https://github.com/IlleNilsson/xmip-core-message", branch = "main" }
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }
# X.690, for the conversion that lets a technology reading a Kerberos token
# with it write `?`.
asn1 = { package = "xmip-core-asn1", git = "https://github.com/IlleNilsson/xmip-core-asn1", branch = "main" }
# Encoding primitives, whose failures this crate's error takes with `From`.
codec = { package = "xmip-core-codec", git = "https://github.com/IlleNilsson/xmip-core-codec", branch = "main" }
# Network primitives, whose failures this crate's error takes with `From`.
net = { package = "xmip-core-net", git = "https://github.com/IlleNilsson/xmip-core-net", branch = "main" }
# RFC 7515 base64url, for the compact token the jwt and oidc technologies read.
base64 = "0.22"
